name: Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  # a release made on github.com (it also makes the tag)
  release:
    types: [published]

# Cancel superseded runs on the same ref (keeps PR feedback fast).
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with Makefile RELEASE_VERSION / firmware DOCKER_IMAGE.
  DOCKER_IMAGE: sylverb/retro-go-sd-builder:v1.5

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      project_kind: ${{ steps.meta.outputs.project_kind }}
      packed_bin: ${{ steps.meta.outputs.packed_bin }}
      target_elf: ${{ steps.meta.outputs.target_elf }}
      target_map: ${{ steps.meta.outputs.target_map }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags so `git describe --tags --dirty` works for CORE_VERSION.
          fetch-depth: 0

      - name: Read project metadata
        id: meta
        run: |
          set -euo pipefail
          PROJECT_KIND="$(make --no-print-directory -f Makefile print-PROJECT_KIND)"
          PACKED_BIN="$(make --no-print-directory -f Makefile print-PACKED_BIN)"
          TARGET_ELF="$(make --no-print-directory -f Makefile print-TARGET_ELF)"
          TARGET_MAP="$(make --no-print-directory -f Makefile print-TARGET_MAP)"
          echo "project_kind=${PROJECT_KIND}" >> "${GITHUB_OUTPUT}"
          echo "packed_bin=${PACKED_BIN}" >> "${GITHUB_OUTPUT}"
          echo "target_elf=${TARGET_ELF}" >> "${GITHUB_OUTPUT}"
          echo "target_map=${TARGET_MAP}" >> "${GITHUB_OUTPUT}"
          echo "PROJECT_KIND=${PROJECT_KIND}"
          echo "PACKED_BIN=${PACKED_BIN}"
          echo "TARGET_ELF=${TARGET_ELF}"
          echo "TARGET_MAP=${TARGET_MAP}"

      - name: Build (Docker)
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/opt/workdir" \
            -w /opt/workdir \
            "${{ env.DOCKER_IMAGE }}" \
            make --no-print-directory -j"$(nproc)" all

      - name: Build isolated GWRG WASM converter
        run: tools/extractor/build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            ${{ steps.meta.outputs.packed_bin }}
            ${{ steps.meta.outputs.target_elf }}
            ${{ steps.meta.outputs.target_map }}
            tools/extractor/build/jazz-assets.wasm
          if-no-files-found: error

  release:
    if: (github.event_name == 'push' || github.event_name == 'release') && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # Full history + tags so `git describe --tags --dirty` works for CORE_VERSION.
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: Set up Python (zig for the music renderers)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the music renderers (Linux, Windows, macOS)
        run: |
          set -euo pipefail
          python3 -m pip install ziglang
          tools/build_renderers.sh

      - name: Stage release assets
        run: |
          set -euo pipefail
          PACKED_BIN="${{ needs.build.outputs.packed_bin }}"
          TARGET_ELF="${{ needs.build.outputs.target_elf }}"
          TARGET_MAP="${{ needs.build.outputs.target_map }}"
          # Artifact download preserves relative paths under dist/.
          python3 scripts/stage_release.py \
            --bin "dist/${PACKED_BIN}" \
            --elf "dist/${TARGET_ELF}" \
            --map "dist/${TARGET_MAP}" \
            --tag "${GITHUB_REF_NAME}" \
            --out release \
            --docker-image "${{ env.DOCKER_IMAGE }}"

      - name: Build GWRG manifest and offline bundle
        run: |
          set -euo pipefail
          mkdir -p release/gwrg
          cp "dist/${{ needs.build.outputs.packed_bin }}" release/gwrg/Jazz.bin
          cp dist/tools/extractor/build/jazz-assets.wasm release/gwrg/jazz-assets.wasm
          python3 scripts/make_manifest.py \
            --bin release/gwrg/Jazz.bin \
            --wasm release/gwrg/jazz-assets.wasm \
            --tag "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --out release/gwrg/manifest.json
          python3 scripts/make_bundle.py \
            --manifest release/gwrg/manifest.json \
            --dir release/gwrg \
            --out "release/gwrg/jazz-jackrabbit-${GITHUB_REF_NAME}-bundle.zip"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mapfile -t names < release/release-files.txt
          files=()
          for name in "${names[@]}"; do
            files+=("release/${name}")
          done
          files+=(
            release/gwrg/manifest.json
            release/gwrg/Jazz.bin
            release/gwrg/jazz-assets.wasm
            "release/gwrg/jazz-jackrabbit-${GITHUB_REF_NAME}-bundle.zip"
          )
          # The release may already exist (made on github.com, which also
          # makes the tag): add / replace the files and the notes.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --clobber "${files[@]}"
            gh release edit "${TAG}" --notes-file release/RELEASE_NOTES.md
          else
            gh release create "${TAG}" \
              --title "${TAG}" \
              --notes-file release/RELEASE_NOTES.md \
              "${files[@]}"
          fi

  pages:
    if: >-
      always() &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v'))) &&
      needs.build.result == 'success' &&
      (needs.release.result == 'success' || needs.release.result == 'skipped')
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download the homebrew binary
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist

      - name: Build the browser converter and mirror published releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tools/browser/build-page.sh "${RUNNER_TEMP}/jazz-pages" \
            "${GITHUB_WORKSPACE}/dist/${{ needs.build.outputs.packed_bin }}" \
            "${GITHUB_WORKSPACE}/dist/tools/extractor/build/jazz-assets.wasm"
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            python3 scripts/build_dist.py --repo "${GITHUB_REPOSITORY}" \
              --out "${RUNNER_TEMP}/jazz-pages/dist" --retain 5 \
              --require-tag "${GITHUB_REF_NAME}"
          else
            has_manifest=false
            while IFS= read -r tag; do
              if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
                  --json assets --jq '.assets[].name' | grep -qx manifest.json; then
                has_manifest=true
                break
              fi
            done < <(gh release list --repo "${GITHUB_REPOSITORY}" \
              --limit 100 --json tagName --jq '.[].tagName')
            if [[ "${has_manifest}" == true ]]; then
              python3 scripts/build_dist.py --repo "${GITHUB_REPOSITORY}" \
                --out "${RUNNER_TEMP}/jazz-pages/dist" --retain 5
            else
              mkdir -p "${RUNNER_TEMP}/jazz-pages/dist"
            fi
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/jazz-pages

      - id: deploy
        uses: actions/deploy-pages@v4
